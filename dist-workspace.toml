[workspace]
members = ["cargo:."]

# Config for 'dist' (https://opensource.axo.dev/cargo-dist/)
[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# Linux musl and Windows x64 (the Windows Recycle Bin backend). No darwin stubs:
# macOS tarballs come from release-musl.yml.
installers = ["shell", "powershell"]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
# On PRs, only run `dist plan` (no full multi-target build noise).
pr-run-mode = "plan"
# Tag GitHub Releases are created by release-musl.yml (package-release /
# cargo-binstall layout). cargo-dist only plans on PRs (see release.yml on:).
create-release = false
# release.yml is post-processed by scripts/dist-pr-only-release-yml.sh, so it
# never matches the generated file byte for byte. Skip that check in `dist plan`.
allow-dirty = ["ci"]
