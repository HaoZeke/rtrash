# Quality bar: fmt, clippy (-D warnings), nextest (locked), supply-chain (cargo-deny),
# shell completion syntax, shared extent tests on btrfs and XFS loop images,
# tests plus a du smoke test on Windows and macOS, and cross-restore with
# trash-cli, gtrash and gio.
# Spelling runs through prek (codespell) in pre_commit.yml.
name: CI

on:
  push:
    branches: [main, "round*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check:
    name: fmt · clippy · nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Precheck (same command agents run before a push)
        run: python3 scripts/precheck.py

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (no TUI feature, tests included)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Test (nextest, locked, ci profile)
        run: cargo nextest run --locked --profile ci

      - name: Test without the TUI feature
        run: cargo nextest run --locked --profile ci --no-default-features

      - name: du smoke test against du(1) and a Python walk
        run: |
          cargo build --locked --release
          fixture=$(mktemp -d)
          head -c 1000000 /dev/urandom > "$fixture/a.bin"
          ln "$fixture/a.bin" "$fixture/a-link.bin"
          ln -s "$fixture/a.bin" "$fixture/a-sym"
          mkdir -p "$fixture/d/e"
          echo hi > "$fixture/d/e/f"
          scripts/du-smoke.sh target/release/rtrash "$(rustc --print sysroot)" "${CARGO_HOME:-$HOME/.cargo}/registry/src" "$fixture"

  musl-clippy:
    name: clippy · x86_64 musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      # mimalloc's C code builds with musl-gcc for the musl target.
      - name: musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # libc deprecates some aliases on musl only (time_t, suseconds_t),
      # so the glibc clippy above does not see them.
      - name: Clippy (musl)
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl -- -D warnings

      - name: Clippy (musl, no TUI feature, tests included)
        run: cargo clippy --locked --all-targets --target x86_64-unknown-linux-musl --no-default-features -- -D warnings

  reflink:
    name: reflink · ${{ matrix.fs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, xfs]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Mount a ${{ matrix.fs }} loop image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs xfsprogs
          truncate -s 1G "$RUNNER_TEMP/reflink.img"
          if [ "${{ matrix.fs }}" = xfs ]; then
            mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/reflink.img"
          else
            mkfs.btrfs -q "$RUNNER_TEMP/reflink.img"
          fi
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink
          sudo chown "$(id -u):$(id -g)" /mnt/reflink
          echo "RTRASH_REFLINK_DIR=/mnt/reflink" >> "$GITHUB_ENV"
          # The bind mount test: dst shows src, on the same device.
          mkdir -p /mnt/reflink/bind/src /mnt/reflink/bind/dst
          sudo mount --bind /mnt/reflink/bind/src /mnt/reflink/bind/dst
          echo "RTRASH_BIND_DIR=/mnt/reflink/bind" >> "$GITHUB_ENV"

      - name: Shared extent tests
        run: cargo test --locked --test reflink_fs -- --nocapture

      # Facts for shortlist 31(f) (ncdu #234): what st_blocks, FIEMAP and
      # rtrash du report for compressed files on btrfs, next to compsize
      # (which reads the extent tree as root). A second image, mounted
      # with compress-force=zstd, keeps the tests above on a plain mount.
      # It asserts nothing and cannot fail the job.
      - name: Report what du sees of compressed btrfs files (facts only)
        if: matrix.fs == 'btrfs'
        continue-on-error: true
        run: |
          uname -r || true
          sudo apt-get install -y -qq btrfs-compsize || true
          truncate -s 1G "$RUNNER_TEMP/zstd.img"
          mkfs.btrfs -q "$RUNNER_TEMP/zstd.img" || true
          sudo mkdir -p /mnt/zstd
          sudo mount -o loop,compress-force=zstd "$RUNNER_TEMP/zstd.img" /mnt/zstd || true
          sudo chown "$(id -u):$(id -g)" /mnt/zstd || true
          mkdir -p /mnt/zstd/d
          # 8 MiB that compresses well, 8 MiB that does not, and a small file.
          yes 'rtrash compressed btrfs facts' | head -c 8388608 > /mnt/zstd/d/text || true
          head -c 8388608 /dev/urandom > /mnt/zstd/d/random || true
          printf 'tiny file\n' > /mnt/zstd/d/tiny || true
          cp --reflink=always /mnt/zstd/d/text /mnt/zstd/d/text-clone || true
          sync
          echo "== stat: name, size, st_blocks, block unit"
          stat -c '%n %s %b %B' /mnt/zstd/d/* || true
          echo "== du -B1 and du -b"
          du -B1 /mnt/zstd/d/* /mnt/zstd/d || true
          du -b /mnt/zstd/d/* /mnt/zstd/d || true
          echo "== compsize"
          sudo compsize -b /mnt/zstd/d || true
          for f in text random tiny text-clone; do
            sudo compsize -b "/mnt/zstd/d/$f" || true
          done
          echo "== filefrag -v"
          filefrag -v /mnt/zstd/d/text /mnt/zstd/d/random /mnt/zstd/d/tiny || true
          echo "== raw FIEMAP: logical physical length reserved64[0] reserved64[1] flags"
          python3 - /mnt/zstd/d/text /mnt/zstd/d/random /mnt/zstd/d/tiny <<'PY' || true
          import fcntl, struct, sys
          N = 32
          for path in sys.argv[1:]:
              buf = bytearray(struct.pack("=QQIIII", 0, 2**64 - 1, 1, 0, N, 0) + bytes(56 * N))
              with open(path, "rb") as f:
                  fcntl.ioctl(f.fileno(), 0xC020660B, buf)
              mapped = struct.unpack_from("=I", buf, 20)[0]
              print(path, "mapped", mapped)
              for i in range(min(mapped, N)):
                  lo, ph, ln, r0, r1, fl = struct.unpack_from("=QQQQQI", buf, 32 + 56 * i)
                  print(f"  {lo} {ph} {ln} {r0} {r1} 0x{fl:x}")
          PY
          echo "== rtrash du --json root totals, plain and with --unique"
          for extra in "" "--unique"; do
            target/debug/rtrash du --json --no-git $extra /mnt/zstd/d | tr ',' '\n' \
              | grep -E '"(path|disk|apparent|unique|files)"' | head -n 12 || true
          done

  windows:
    name: windows · test · du smoke
    runs-on: windows-latest
    steps:
      # Keep LF endings so tests that read checked-in files see what Unix sees.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Test without the TUI feature
        run: cargo test --locked --no-default-features

      # The PowerShell tables against what this build's --help shows, and a
      # live completion through the runner's pwsh.
      - name: PowerShell completions against the Windows help
        run: cargo test --locked --test windows_completions -- --nocapture

      - name: du smoke test against PowerShell
        shell: pwsh
        run: |
          cargo build --locked --release
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          ./scripts/du-smoke.ps1 -Rtrash target/release/rtrash.exe -Trees (rustc --print sysroot), (Join-Path $cargoHome 'registry/src')

  windows-mount:
    name: windows · folder-mounted volume
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The runner is an administrator, so diskpart can make, attach and
      # mount a small NTFS VHD on a folder of drive C.
      - name: Mount a VHD on a folder
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'rtrash-mount.vhdx'
          $mnt = 'C:\rtrash-mnt'
          New-Item -ItemType Directory -Force $mnt | Out-Null
          $script = Join-Path $env:RUNNER_TEMP 'diskpart.txt'
          @(
            "create vdisk file=""$vhd"" maximum=256 type=expandable",
            "select vdisk file=""$vhd""",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick label=rtrashmnt",
            "assign mount=""$mnt"""
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Volume -FileSystemLabel rtrashmnt | Format-List
          "RTRASH_MOUNTED_DIR=$mnt" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Folder-mounted volume tests
        run: cargo test --locked --test windows_mount -- --nocapture --test-threads=1

  macos:
    name: ${{ matrix.os }} · test · du smoke
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon, and the last Intel image GitHub offers.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A second volume, so a put or restore copies across volumes and the
      # access control list test has something to copy to.
      - name: Mount a disk image as a second volume
        run: |
          hdiutil create -size 64m -fs APFS -volname rtrashacl -attach "$RUNNER_TEMP/rtrashacl.dmg"
          echo "RTRASH_TEST_OTHER_VOLUME=/Volumes/rtrashacl" >> "$GITHUB_ENV"

      # The suite checks the FreeDesktop layout; the Finder default has its
      # own tests (which set RTRASH_MACOS_TRASH=finder) and job below.
      - name: Test
        run: cargo test --locked
        env:
          RTRASH_MACOS_TRASH: freedesktop

      - name: Test without the TUI feature
        run: cargo test --locked --no-default-features
        env:
          RTRASH_MACOS_TRASH: freedesktop

      - name: du smoke test with getattrlistbulk and with stat
        run: |
          cargo build --locked --release
          fixture=$(mktemp -d)
          head -c 1000000 /dev/urandom > "$fixture/a.bin"
          ln "$fixture/a.bin" "$fixture/a-link.bin"
          ln -s "$fixture/a.bin" "$fixture/a-sym"
          mkdir -p "$fixture/d/e"
          echo hi > "$fixture/d/e/f"
          for bulk in 1 0; do
            echo "RTRASH_DU_BULK=$bulk"
            RTRASH_DU_BULK=$bulk scripts/du-smoke.sh target/release/rtrash \
              "$(rustc --print sysroot)" "${CARGO_HOME:-$HOME/.cargo}/registry/src" "$fixture"
          done

  macos-finder:
    name: macOS Finder Trash (plain put · list · restore · empty)
    runs-on: macos-latest
    # Finder must accept Apple events from the runner; until a run shows
    # the runner image allows that, a failure here does not fail CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Mount a disk image as an external volume
        run: |
          hdiutil create -size 64m -fs APFS -volname rtrashext -attach "$RUNNER_TEMP/rtrashext.dmg"
          echo "RTRASH_SMOKE_VOLUME=/Volumes/rtrashext" >> "$GITHUB_ENV"

      - name: Finder default against the real Finder
        run: |
          cargo build --locked --release
          scripts/finder-smoke.sh target/release/rtrash

  interop:
    name: interop (trash-cli · gtrash · gio cross-restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install trash-cli, gtrash, gio and ncdu
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gvfs libglib2.0-bin dbus
          pipx install trash-cli
          curl -fsSL https://github.com/umlx5h/gtrash/releases/download/v0.0.6/gtrash_Linux_x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gtrash
          # ncdu 2.9.1's static build, for the ncdu -c import check;
          # Ubuntu's apt ncdu is 1.x, which has no -c.
          curl -fsSL -o "$RUNNER_TEMP/ncdu.tar.gz" https://dev.yorhel.nl/download/ncdu-2.9.1-linux-x86_64.tar.gz
          echo "0c6c84b3f763c33baa051c8327f0e736f46f33a8cc061bb951d24517a8c5d73e  $RUNNER_TEMP/ncdu.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/ncdu.tar.gz" -C "$RUNNER_TEMP" ncdu
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # trash-cli checks a volume trash's Path= only on a real mount
      # other than /, so the volume escape check gets a small tmpfs.
      - name: Mount a scratch volume
        run: |
          mkdir -p "$RUNNER_TEMP/rtv/vol"
          sudo mount -t tmpfs -o "size=8m,uid=$(id -u),gid=$(id -g),mode=0755" tmpfs "$RUNNER_TEMP/rtv/vol"
          echo "RTRASH_INTEROP_VOLUME=$RUNNER_TEMP/rtv/vol" >> "$GITHUB_ENV"

      - name: Cross-restore every pairing
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          # GLib 2.80's gio restores any non-ASCII name escaped ('x é'
          # comes back as 'x \xc3\xa9'); the script probes it and fails
          # once the bug is gone.
          RTRASH_INTEROP_EXPECT_GIO_UTF8_BUG: "1"
        run: |
          cargo build --locked --release
          # gio reaches trash:// through gvfsd on a session bus, which a
          # runner does not start; dbus-run-session gives the script one.
          RTRASH_INTEROP_GIO_EMPTY=1 dbus-run-session -- scripts/interop-smoke.sh target/release/rtrash

  completions:
    name: completion syntax (bash · zsh · fish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and fish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish

      - name: Parse each completion script
        run: |
          bash -n completions/rtrash.bash
          zsh -n completions/_rtrash
          fish --no-execute completions/rtrash.fish

      - name: Load the zsh and fish completions
        run: |
          zsh -f -c 'fpath=(completions $fpath); autoload -Uz compinit; compinit -u -D; autoload -Uz +X _rtrash'
          fish --no-config -c 'source completions/rtrash.fish; complete -C "rtrash restore --js" | string match -q -- "--json*"'

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Python headers for --all-features
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check locked dependencies at the declared minimum
        run: cargo check --all-features --locked
